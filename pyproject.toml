[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nordic-asr"
version = "0.1.0"
description = "Reproducible Norwegian, Sámi and Kven ASR experiments"
requires-python = ">=3.10,<3.13"
dependencies = [
  "accelerate>=1.10,<2",
  "datasets[audio]>=3.6,<5",
  "evaluate>=0.4,<0.5",
  "huggingface-hub>=0.34,<1",
  "jiwer>=4,<5",
  "librosa>=0.11,<0.12",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "peft>=0.17,<0.18",
  "pyarrow>=20,<26",
  "pyyaml>=6,<7",
  "safetensors>=0.6,<0.9",
  "soundfile>=0.13,<0.15",
  "torch>=2.4,<2.9",
  "torchaudio>=2.4,<2.9",
  "transformers>=4.56,<5",
]

[project.optional-dependencies]
quality = [
  "audiomentations>=0.42,<0.43",
  "datasketch>=1.6,<2",
  "ftfy>=6.3,<7",
]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<0.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
